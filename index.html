<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>定期置き場</title>
<style>
body { margin: 30px; font-family: sans-serif; }
h1 { font-size: 54px; margin: 0 0 75px; }
main { display: grid; grid-template-columns: 300px 300px; gap: 60px 65px; }
.box { width: 300px; height: 270px; box-sizing: border-box; display: flex; align-items: center; justify-content: center; background: white; border: 1px solid black; color: black; font-size: 24px; text-decoration: none; text-align: center; }
.box span { width: 3em; word-break: break-all; line-height: 1.3; }
@media(max-width: 720px) {
  body { margin: 20px; }
  h1 { font-size: 42px; margin-bottom: 55px; }
  main { grid-template-columns: 1fr 1fr; gap: 35px 20px; }
  .box { width: 100%; height: 230px; font-size: 20px; }
}
</style>
</head>
<body>
